<!-- Lecture (ليكچر) — v1.6 — study app for pharmacy students -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5138">
<meta name="description" content="ليكچر: ارفع محاضرتك وذاكرها بطرق صيدلانية بضغطة واحدة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ليكچر">
<title>ليكچر</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@700&text=%D9%84%D9%8A%D9%83%DA%86%D8%B1&display=swap">
<style>
:root{
  --primary:#1F5138; --primary-700:#163B29; --primary-50:#E8F1EB; --on-primary:#F5E6C8;
  --accent:#F5E6C8; --accent-ink:#5C4612;
  --bg:#FBF7EE; --surface:#FFFFFF; --line:#E6DDC8; --line-strong:#CFC3A6;
  --ink:#1D2A23; --muted:#56655C;
  --red:#B42318; --red-50:#FDECEA; --amber:#8A5300; --amber-50:#FFF3D9; --green:#1E7B4D; --green-50:#E3F4EA;
  --r-sm:10px; --r:14px; --r-lg:20px; --pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --fs-xs:13px; --fs-sm:14px; --fs:16px; --fs-md:18px; --fs-lg:21px; --fs-xl:27px;
  --shadow:0 1px 2px rgba(22,59,41,.06),0 6px 18px rgba(22,59,41,.07);
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --brand:'El Messiri','IBM Plex Sans Arabic',serif;
  --focus:0 0 0 3px #F2C14E;
  --nav-h:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.7;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);padding-top:max(var(--s2),env(safe-area-inset-top));min-height:56px}
.topbar h1{font-size:var(--fs-md);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:var(--pill);border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--primary-50)}
.banner{font-size:var(--fs-sm);padding:var(--s2) var(--s4);text-align:center}
.banner.demo{background:var(--amber-50);color:var(--amber)}
.banner.off{background:#2B2B2B;color:#F2E7CE}
.banner.ios{background:var(--primary-50);color:var(--primary-700);display:flex;gap:var(--s2);align-items:center;text-align:start}
main{flex:1;padding:var(--s4)}
footer.ver{text-align:center;color:var(--muted);font-size:var(--fs-xs);padding:var(--s2) var(--s4) calc(var(--nav-h) + var(--s5) + env(safe-area-inset-bottom))}
body.nonav footer.ver{padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom))}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:500}
.nav a[aria-current="page"]{color:var(--primary)}
.nav a[aria-current="page"] .navpill{background:var(--primary-50)}
.navpill{display:grid;place-items:center;width:52px;height:28px;border-radius:var(--pill)}
h2{font-size:var(--fs-lg);margin:var(--s5) 0 var(--s3);line-height:1.4}
h3{font-size:var(--fs-md);margin:0 0 var(--s2);line-height:1.45}
p{margin:0 0 var(--s3)}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:var(--s2);align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:0 var(--s5);border-radius:var(--pill);border:1.5px solid transparent;font-weight:700;font-size:var(--fs);cursor:pointer;text-decoration:none;text-align:center;line-height:1.3}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not([disabled]){background:var(--primary-700)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--primary)}
.btn-soft{background:var(--primary-50);color:var(--primary-700)}
.btn-amber{background:var(--amber-50);color:var(--amber);border-color:#F0D49A}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 var(--s4);font-size:var(--fs-sm)}
.btn-big{min-height:64px;font-size:var(--fs-md);border-radius:var(--r-lg)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:2px 10px;font-size:var(--fs-xs);font-weight:500;background:var(--primary-50);color:var(--primary-700);white-space:nowrap}
.chip.amber{background:var(--amber-50);color:var(--amber)}
.chip.red{background:var(--red-50);color:var(--red)}
.chip.green{background:var(--green-50);color:var(--green)}
.chip.gray{background:#EFEBE2;color:var(--muted)}
.page{display:inline-flex;align-items:center;border-radius:var(--pill);border:1px solid var(--line-strong);padding:0 8px;font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500;line-height:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:500;font-size:var(--fs-sm)}
.input,select.input,textarea.input{width:100%;min-height:48px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-size:var(--fs)}
textarea.input{min-height:140px;resize:vertical;line-height:1.7}
.input:focus{border-color:var(--primary);outline:none;box-shadow:var(--focus)}
.choice{display:flex;gap:var(--s2);flex-wrap:wrap}
.choice label{flex:1;min-width:130px;display:flex;align-items:center;gap:var(--s2);min-height:52px;padding:0 var(--s4);border:1.5px solid var(--line-strong);border-radius:var(--r);cursor:pointer;background:var(--surface)}
.choice input{accent-color:var(--primary);width:20px;height:20px}
.choice label:has(input:checked){border-color:var(--primary);background:var(--primary-50)}
.err{background:var(--red-50);color:var(--red);border-radius:var(--r);padding:var(--s3) var(--s4)}
.okbox{background:var(--green-50);color:var(--green);border-radius:var(--r);padding:var(--s3) var(--s4)}
.note{background:var(--amber-50);color:var(--amber);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:var(--fs-sm)}
.state{text-align:center;padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.state .ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.state.error .ico{background:var(--red-50);color:var(--red)}
.skel{background:linear-gradient(90deg,#EFE8D8 25%,#F7F2E6 50%,#EFE8D8 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:var(--r);height:84px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--primary-50);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.skel,.spinner{animation:none}}
.caps{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.caps i{display:block;width:18px;height:9px;border-radius:var(--pill);border:1.5px solid var(--primary);background:transparent}
.caps i.on{background:var(--primary)}
.caps i.cur{width:26px;height:12px;background:var(--primary)}
.caps i.bad{background:var(--red);border-color:var(--red)}
.hero{text-align:center;padding:var(--s6) var(--s2) var(--s4)}
.wordmark{font-family:var(--brand);font-weight:700;font-size:56px;line-height:1.1;color:var(--primary);margin:var(--s3) 0 0}
.wordmark-en{letter-spacing:.34em;font-size:13px;color:var(--primary);font-weight:700;direction:ltr;margin-bottom:var(--s4)}
.status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--pill);padding:6px 12px;font-size:var(--fs-sm);font-weight:500}
.lect{display:flex;gap:var(--s3);align-items:flex-start;text-decoration:none;color:inherit}
.lect .thumb{flex:none;width:48px;height:56px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.lect .meta{flex:1;min-width:0}
.lect h3{margin:0 0 2px;overflow-wrap:anywhere}
.group-title{display:flex;align-items:center;gap:var(--s2);margin:var(--s5) 0 var(--s3);font-size:var(--fs-md);font-weight:700;color:var(--primary-700)}
.group-title::before{content:"";width:22px;height:10px;border-radius:var(--pill);background:var(--primary)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:118px;padding:var(--s3) var(--s3) var(--s3);border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--surface);cursor:pointer;text-align:start;box-shadow:var(--shadow)}
.mode:hover:not(.dim){border-color:var(--primary)}
.mode .mi{width:40px;height:40px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.mode b{font-size:15px;line-height:1.35}
.mode span.d{font-size:12.5px;color:var(--muted);line-height:1.45}
.mode .badge{position:absolute;top:10px;left:10px}
.mode.dim{opacity:.55;box-shadow:none;cursor:not-allowed;background:#F6F2E9}
.mode.locked{background:#F6F2E9}
.tabs{display:flex;gap:6px;background:#EFE8D8;border-radius:var(--pill);padding:4px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:var(--pill);background:transparent;font-weight:500;cursor:pointer;font-size:var(--fs-sm)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--primary-700);box-shadow:var(--shadow)}
.content{overflow-wrap:anywhere}
.content[dir="ltr"]{text-align:left}
.item{position:relative}
.item + .item{margin-top:var(--s3)}
.itemhead{display:flex;align-items:flex-start;gap:var(--s2);justify-content:space-between}
.itemhead h3{flex:1;min-width:0}
.analogy{display:flex;gap:var(--s2);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:var(--s3);margin-top:var(--s2);font-size:var(--fs-sm)}
ul.clean{margin:0;padding-inline-start:20px}
ul.clean li{margin:2px 0}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-inline-start:18px;border-inline-start:2px solid var(--line-strong);margin-inline-start:10px}
.tree li{position:relative;margin:6px 0}
.tree ul > li::before{content:"";position:absolute;inset-inline-start:-18px;top:18px;width:14px;border-top:2px solid var(--line-strong)}
.node{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.45}
.node.l0{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
.node.l1{background:var(--primary-50);border-color:#BFD6C7;font-weight:700}
.opt{display:flex;align-items:flex-start;gap:var(--s2);width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:start;font-size:var(--fs);line-height:1.5}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#EFE8D8;font-size:13px;font-weight:700}
.opt.right{border-color:var(--green);background:var(--green-50)}
.opt.wrong{border-color:var(--red);background:var(--red-50)}
.opt[disabled]{cursor:default;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:var(--s2)}
.analysis{margin-top:var(--s3);border-top:1px dashed var(--line-strong);padding-top:var(--s3);font-size:var(--fs-sm)}
.analysis li{margin-bottom:6px}
.golden{margin-top:var(--s3);display:flex;gap:var(--s2);align-items:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:var(--s3);font-weight:500}
.golden .lbl{font-weight:700;flex:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:var(--s2)}
table.mx{border-collapse:collapse;min-width:100%;font-size:var(--fs-sm)}
table.mx th,table.mx td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start;min-width:120px}
table.mx th{background:var(--primary);color:var(--on-primary);font-weight:700}
table.mx td:first-child{font-weight:700;background:#F8F4EA}
.mnemo{font-size:26px;font-weight:700;color:var(--primary);letter-spacing:.02em;direction:ltr;text-align:left;line-height:1.35;margin:var(--s2) 0}
.bd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--fs-sm)}
.bd .k{font-weight:700;color:var(--primary)}
.lik{display:flex;align-items:center;gap:var(--s2);font-weight:700;margin:var(--s4) 0 var(--s2)}
.lik i{width:12px;height:12px;border-radius:50%}
.sent{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;margin-bottom:var(--s2);cursor:pointer;line-height:1.6;font-size:var(--fs)}
.sent[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-50)}
.sent.hit{border-color:var(--green);background:var(--green-50)}
.sent.miss{border-color:var(--amber);background:var(--amber-50)}
.sent.false{border-color:var(--red);background:var(--red-50)}
.fixline{display:block;margin-top:6px;font-size:var(--fs-sm);color:var(--green);font-weight:500}
.score{display:flex;align-items:center;gap:var(--s4)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:var(--fs-lg);background:conic-gradient(var(--primary) calc(var(--p)*1%),#E8E0CC 0);position:relative}
.ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;z-index:1}
.drug-head{display:flex;gap:var(--s3);align-items:center}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:var(--fs-md)}
.intro{font-size:var(--fs-md);line-height:1.7;margin:var(--s3) 0;padding-inline-start:var(--s3);border-inline-start:4px solid var(--accent)}
.kv{margin-top:var(--s2)}
.kv .k{font-weight:700;font-size:var(--fs-sm);color:var(--primary-700)}
.sets{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:4px}
.sets button{flex:none;min-height:44px;border-radius:var(--pill);border:1.5px solid var(--line-strong);background:var(--surface);padding:0 14px;cursor:pointer;font-size:var(--fs-sm);font-weight:500}
.sets button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.timeline{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line-strong);margin-inline-start:8px}
.timeline li{position:relative;padding:0 var(--s4) var(--s3)}
.timeline li::before{content:"";position:absolute;inset-inline-start:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--bg)}
.timeline a{text-decoration:none;color:inherit;display:block;min-height:44px}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:var(--s3);margin-bottom:var(--s2)}
.day .sess{display:flex;gap:var(--s2);align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:var(--fs-sm)}
.day .sess:first-of-type{border-top:0}
.bar{height:10px;border-radius:var(--pill);background:#EFE8D8;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:var(--pill)}
.steps-list{counter-reset:st;list-style:none;margin:0;padding:0}
.steps-list > li{counter-increment:st;position:relative;padding-inline-start:44px;margin-bottom:var(--s5)}
.steps-list > li::before{content:counter(st);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700}
.illus{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:min(92vw,520px);background:#1D2A23;color:#fff;border-radius:var(--r);padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:var(--fs-sm)}
.toast.bad{background:var(--red)}
dialog{border:0;border-radius:var(--r-lg);padding:0;width:min(94vw,500px);max-height:90vh;color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(20,30,25,.45)}
.dlg{padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;letter-spacing:.08em;font-weight:700}
.calc-in{display:flex;gap:var(--s2);align-items:center}
.calc-in .input{direction:ltr;text-align:left;flex:1;min-width:0}
.calc-in .btn{flex:none;white-space:nowrap}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:var(--s2);border:2px dashed var(--line-strong);border-radius:var(--r-lg);padding:var(--s6) var(--s4);text-align:center;background:var(--surface);cursor:pointer}
.dropzone:focus-within{box-shadow:var(--focus)}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.prog li{display:flex;align-items:center;gap:var(--s3);color:var(--muted)}
.prog li.now{color:var(--ink);font-weight:700}
.prog li.ok{color:var(--green)}
.prog .dot{width:28px;height:28px;flex:none;display:grid;place-items:center}
.prog .dot i{display:block;width:20px;height:10px;border-radius:var(--pill);border:1.5px solid currentColor}
.prog li.ok .dot i{background:currentColor}
details.ex{background:#F8F4EA;border-radius:var(--r);padding:var(--s2) var(--s3);font-size:var(--fs-sm)}
details.ex summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:500}
pre.wrap{white-space:pre-wrap;font-family:inherit;margin:0}
.today{border-color:var(--primary);box-shadow:var(--shadow)}
.past{opacity:.6}
.features{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s3)}
.feature{display:flex;align-items:center;gap:var(--s3);text-decoration:none;color:inherit;padding:var(--s3) var(--s4)}
.feature .mi{flex:none;width:48px;height:48px;border-radius:14px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.feature .meta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.feature .chev{color:var(--muted);transform:scaleX(-1);display:grid}
.tip{display:flex;flex-direction:column;gap:2px;padding:var(--s2) 0;border-bottom:1px dashed var(--line)}
.tip b{color:var(--primary-700)}
.tabs.scroll{overflow-x:auto;scrollbar-width:none}
.tabs.scroll::-webkit-scrollbar{display:none}
.tabs.scroll button{flex:1 0 auto;padding:0 14px;white-space:nowrap}
.steps-list > li.step-now{background:var(--amber-50);border-radius:var(--r);box-shadow:0 0 0 8px var(--amber-50)}
.gen-bar{height:8px}
.gen-bar i{background:var(--primary);transition:width .4s ease}
.reel-cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s4);border-radius:var(--r-lg);background:linear-gradient(160deg,#1F5138,#0F2E20);color:#F7EEDC}
.reel-cover h3{color:#fff;font-size:var(--fs-lg);margin:0}
.reel-cover p{margin:0;opacity:.9}
.reel-cover .btn-primary,.reel-cover .btn-primary:hover:not([disabled]){background:#F5E6C8;color:#163B29}
.rc-stack{position:relative;width:96px;height:120px;margin-bottom:var(--s2)}
.rc-stack i{position:absolute;inset:0;border-radius:18px;background:rgba(245,230,200,.25);display:grid;place-items:center;color:#163B29}
.rc-stack i:nth-child(1){transform:rotate(-12deg) translateX(-14px)}
.rc-stack i:nth-child(2){transform:rotate(9deg) translateX(14px);background:rgba(245,230,200,.45)}
.rc-stack i:nth-child(3){background:#F5E6C8}
body.noscroll{overflow:hidden}
.rv{position:fixed;inset:0;z-index:100;background:#0B1711;color:#fff;display:flex;flex-direction:column}
.rv-top{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(env(safe-area-inset-top) + 10px) 14px 14px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.rv-top > *{pointer-events:auto}
.rv-segs{display:flex;gap:4px;direction:ltr}
.rv-segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
.rv-segs i.on{background:#fff}
.rv-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.rv-close{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer}
.rv-feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:none}
.rv-feed::-webkit-scrollbar{display:none}
.rv-slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:92px 16px 104px}
.rv-card{width:100%;max-width:520px;max-height:100%;overflow:auto;border-radius:28px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;color:#FBF4E4;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.rv-card.c0{background:linear-gradient(165deg,#24603F,#0F2E20)}
.rv-card.c1{background:linear-gradient(165deg,#1C5C62,#0D2F33)}
.rv-card.c2{background:linear-gradient(165deg,#5B3A6E,#2A1836)}
.rv-card.c3{background:linear-gradient(165deg,#7A4A1C,#3A220C)}
.rv-card.c4{background:linear-gradient(165deg,#24456E,#0F2138)}
.rv-card .emoji{font-size:56px;line-height:1.1}
.rv-card .hook{font-size:25px;line-height:1.4;margin:0;color:#fff}
.rv-card .rbody{font-size:19px;line-height:1.75}
.rv-card mark{background:#F5E6C8;color:#163B29;border-radius:6px;padding:0 5px;font-weight:700}
.rv-card .page{color:inherit;border-color:rgba(255,255,255,.55)}
.rv-card .rc-num{opacity:.8}
.rv-card.quiz{background:#FBF7EE;color:var(--ink)}
.rv-card.quiz .hook{color:var(--ink);font-size:21px}
.rv-card.quiz .page{color:var(--muted);border-color:var(--line-strong)}
.verdict{font-weight:700;min-height:1.5em}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.rv-end{align-items:center;text-align:center}
.rv-light{background:#F5E6C8;color:#163B29;width:100%}
.rv-ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff;width:100%}
.rv-nav{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:2}
.rv-nav button{min-height:48px;min-width:48px;padding:0 20px;border-radius:999px;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.rv-nav button[disabled]{opacity:.35}
@media (min-width:768px){
  :root{--fs:17px}
  .app,.nav-in{max-width:1000px}
  main{padding:var(--s5) var(--s6)}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .features{flex-direction:row}
  .features .feature{flex:1}
  .lect-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .content,.gen,.dlg{max-width:760px;margin-inline:auto}
  .rv-card .hook{font-size:30px}
  .rv-card .rbody{font-size:21px}
}
@media (min-width:1180px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
/* evidence and dispensing scene */
.evidence{background:var(--green-50);border:1px solid #B9DEC9;border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:6px;margin-top:var(--s3)}
.evidence q{font-style:italic}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--green)}
.scene{background:linear-gradient(180deg,#F2ECDF,#fff);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:8px;margin:var(--s2) 0}
.bubble{max-width:88%;align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;border-end-start-radius:4px;padding:8px 12px;font-size:var(--fs-sm)}
.who{font-size:11.5px;color:var(--muted);font-weight:700}
.rx{align-self:flex-start;width:88%;background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:8px 12px;font-size:var(--fs-sm)}
.rx .sym{font-family:Georgia,serif;font-weight:700;font-size:22px;color:var(--primary);line-height:1}
/* drug story */
.dhero{background:linear-gradient(160deg,#2A6A48,#0F2E20);color:#FBF4E4;border-radius:22px;padding:var(--s4);display:flex;flex-direction:column;gap:10px}
.dhero h3{color:#fff;margin:0;font-size:var(--fs-lg)}
.dhero .avatar{background:var(--accent);color:var(--primary);box-shadow:0 0 0 4px rgba(245,230,200,.25)}
.dhero .hchip{background:rgba(245,230,200,.2);color:#F5E6C8}
.dhero .page{color:#F5E6C8;border-color:rgba(245,230,200,.5)}
.dhero .quote{font-size:var(--fs-md);font-style:italic}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:var(--pill);padding:2px 10px;font-size:13px}
.chapter{display:flex;flex-direction:column;gap:8px}
.chapter .num{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.flow{display:flex;flex-direction:column;gap:6px}
.flowrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow .box{border-radius:10px;padding:5px 9px;font-size:14px;font-weight:500;background:var(--primary-50);color:var(--primary-700);border:1px solid #BFD6C7}
.flow .box.drug{background:var(--primary);color:#fff;border-color:var(--primary)}
.flow .box.bad{background:var(--red-50);color:var(--red);border-color:#F1C2BC}
.arr{color:var(--muted);font-weight:700}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses span{background:#E7EEF7;color:#24456E;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:500}
.villain{display:flex;gap:10px;align-items:flex-start;background:var(--red-50);border-radius:12px;padding:8px 10px}
.villain b{color:var(--red);flex:none;min-width:80px}
.price{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.price span{background:var(--amber-50);color:var(--amber);border-radius:10px;padding:6px 8px;font-size:14px;text-align:center}
.game{background:#F1EAF5;border:1px dashed #C9B3D6;border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.game > .spread b{color:#5B3A6E}
.round{display:flex;flex-direction:column;gap:8px;padding-top:var(--s2);border-top:1px solid #DCCDE6}
/* remember it */
.method{display:flex;flex-direction:column;gap:8px}
.mbadge{display:inline-flex;align-items:center;font-weight:700;font-size:13px;border-radius:var(--pill);padding:3px 10px}
.m-plum .mbadge{background:#F1EAF5;color:#5B3A6E}
.m-blue .mbadge{background:#E7EEF7;color:#24456E}
.m-green .mbadge{background:var(--primary-50);color:var(--primary)}
.m-amber .mbadge{background:var(--amber-50);color:var(--amber)}
.m-teal .mbadge{background:#E6F2F3;color:#1C5C62}
.why{font-size:13px;color:var(--muted)}
.story{margin:0;line-height:1.85}
.story mark{background:#F1EAF5;color:#5B3A6E;border-radius:6px;padding:0 4px;font-weight:700}
.acr{display:flex;gap:6px;flex-wrap:wrap}
.acr span{flex:1;min-width:84px;border-radius:12px;background:var(--primary-50);padding:8px 6px;text-align:center;font-size:13px;overflow-wrap:normal;word-break:normal;hyphens:auto}
.acr b{display:block;font-size:26px;color:var(--primary);line-height:1.2}
.chunks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.chunks div{background:var(--amber-50);border-radius:12px;padding:8px;font-size:13.5px;display:flex;flex-direction:column}
.chunks b{color:var(--amber)}
.m-blue .chunks div{background:#E7EEF7}
.m-blue .chunks b{color:#24456E}
.palace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.palace li{display:flex;gap:8px;align-items:center;font-size:14px;background:#F2F8F8;border-radius:10px;padding:6px 8px}
.palace i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:#1C5C62;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.mbody.covered{filter:blur(8px);user-select:none;pointer-events:none}
.recallq{background:var(--amber-50);border-radius:12px;padding:8px 12px}
.recallq p{margin:0}
.quality{display:flex;gap:var(--s3);align-items:flex-start}
.quality .mi{flex:none;width:40px;height:40px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
/* the lecture on one page */
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.pbox{border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:6px;min-width:0}
.pbox h4{margin:0;font-size:14px;display:flex;align-items:center;gap:6px}
.pbox h4 i{width:10px;height:10px;border-radius:50%;flex:none}
.pbox ul{margin:0;padding-inline-start:18px;font-size:14px}
.pbox li{margin:3px 0}
.pbox.wide{grid-column:1 / -1}
.b-red{background:var(--red-50);border:1px solid #F1C2BC} .b-red h4{color:var(--red)} .b-red h4 i{background:var(--red)}
.b-blue{background:#E7EEF7;border:1px solid #C9D7EA} .b-blue h4{color:#24456E} .b-blue h4 i{background:#24456E}
.b-amber{background:var(--amber-50);border:1px solid #F0D49A} .b-amber h4{color:var(--amber)} .b-amber h4 i{background:var(--amber)}
.b-green{background:var(--green-50);border:1px solid #B9DEC9} .b-green h4{color:var(--green)} .b-green h4 i{background:var(--green)}
.b-plum{background:#F1EAF5;border:1px solid #D9C7E3} .b-plum h4{color:#5B3A6E} .b-plum h4 i{background:#5B3A6E}
table.mini{border-collapse:collapse;min-width:100%;font-size:13px}
table.mini th,table.mini td{padding:5px 6px;border-bottom:1px solid #C9D7EA;text-align:start;vertical-align:top}
table.mini th{color:#24456E}
.cause{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13.5px}
.cause > span:not(.arr):not(.page):not(.selfm){background:#fff;border-radius:8px;padding:2px 7px}
.onepage .cover{position:relative;cursor:default}
.onepage.testing .cover{cursor:pointer;border-radius:8px}
.onepage.testing .cover:not(.shown){color:transparent;text-shadow:0 0 9px rgba(0,0,0,.4);user-select:none}
.onepage.testing .cover:not(.shown) > *{visibility:hidden}
.onepage.testing .cover:not(.shown)::after{content:"اضغط لتتذكّر";position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);font-size:12px;font-weight:700;text-shadow:none;visibility:visible}
.cover.ok{outline:2px solid var(--green);outline-offset:2px}
.cover.no{outline:2px solid var(--red);outline-offset:2px}
.selfm{display:inline-flex;gap:4px;margin-inline-start:6px;vertical-align:middle}
.selfm button{min-width:36px;min-height:32px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;cursor:pointer;font-weight:700}
@media (max-width:400px){ .sheet{grid-template-columns:minmax(0,1fr)} }
#print-root{display:none}
@media print{
  body{background:#fff}
  body.printing .app,body.printing .nav,body.printing .toast,body.printing dialog,body.printing .askfab,body.printing .asksheet{display:none!important}
  body.printing #print-root{display:block;padding:0 8mm;font-size:11.5pt}
  #print-root .card{box-shadow:none;break-inside:avoid;border-color:#ccc}
  #print-root .rv-card{max-height:none;margin-bottom:8px;break-inside:avoid;background:#fff!important;color:#000!important;border:1px solid #999;box-shadow:none}
  #print-root .rv-card .hook{color:#000}
  #print-root .pbreak{break-before:page}
}

/* v1.3: study with me, gallery, new methods */
.keycard{margin-top:16px;border:2px solid var(--primary);background:var(--primary-50)}
.keycard .mi{flex:none;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.swm{margin-top:16px;padding:var(--s4)}
.swm-head h2{margin:0;font-size:22px;color:var(--primary-700)}
.swm-steps{list-style:none;margin:var(--s3) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s4)}
.swm-step{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.swm-step .num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:14px}
.swm-list{display:grid;gap:var(--s2)}
.swm-item{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:start;min-height:64px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:inherit;color:inherit;cursor:pointer;position:relative}
.swm-item:hover{border-color:var(--primary)}
.swm-item .mi{flex:none;width:42px;height:42px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.swm-item .meta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.swm-item .badge{position:static}
.swm-item.locked{opacity:.7}
.allm{margin-top:var(--s4)}
.allm>summary{display:flex;align-items:center;gap:var(--s2);cursor:pointer;font-weight:700;color:var(--primary-700);min-height:44px;list-style:none}
.allm>summary::-webkit-details-marker{display:none}
.allm>summary::after{content:"＋";margin-inline-start:auto;font-weight:700}
.allm[open]>summary::after{content:"－"}
.waitnote{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:61;display:flex;align-items:center;gap:var(--s2);max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--pill);padding:8px 14px;box-shadow:var(--shadow);font-size:var(--fs-sm)}
.waitnote[hidden]{display:none}
.waitnote .spinner{width:16px;height:16px;border-width:2px;flex:none}
.peek{display:flex;margin:var(--s3) auto 0}
.askfab{position:fixed;z-index:110;inset-inline-end:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:var(--pill);border:1.5px solid var(--primary);background:var(--accent);color:var(--primary-700);font:inherit;font-weight:700;box-shadow:0 6px 18px rgba(22,59,41,.25);cursor:pointer}
.askfab:focus-visible,.asksheet :focus-visible{outline:none;box-shadow:var(--focus)}
.asksheet{position:fixed;z-index:120;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:72vh;max-height:72dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.askhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.askabout{background:var(--primary-50);color:var(--primary-700);border-radius:12px;padding:6px 10px;margin:8px 0}
.asksheet .asklog{flex:1;overflow:auto;min-height:72px}
.askans{max-width:100%!important}
.askitem p{margin:0 0 2px}
.askitem details summary{cursor:pointer;font-size:13px;color:var(--muted);min-height:32px;display:flex;align-items:center;gap:6px}
.askitem blockquote{margin:2px 0 8px;padding:6px 10px;border-inline-start:3px solid var(--green);background:var(--green-50);border-radius:8px;font-size:13.5px}
.askanalogy{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 10px;font-size:14px;margin-top:6px}
.askform{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.askform textarea{flex:1;min-height:48px;resize:none}
.galmore .gallery{margin-top:var(--s2)}
.gallery{margin-top:var(--s5)}
.gallery h2{margin-bottom:4px}
.galist{display:grid;gap:var(--s2)}
.gal{display:flex;gap:var(--s3);align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gal .mi{flex:none;width:40px;height:40px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.gal p{margin:2px 0 0}
.gal.extra{margin-top:var(--s3);background:var(--amber-50);border-color:#F0D49A}
.gal.extra .mi{background:#fff;color:var(--amber)}

.pcase{display:flex;gap:var(--s3);align-items:center}
.pcase .mi{flex:none;width:46px;height:46px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.pcase p{margin:2px 0 0}
.chatlog{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.chatlog .bubble{max-width:88%;border-radius:16px;padding:8px 12px;font-size:15px}
.chatlog .bubble small{display:block;font-size:11.5px;opacity:.75}
.chatlog .bubble.pt{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.chatlog .bubble.st{background:var(--primary);color:var(--on-primary);align-self:flex-end}
.chatlog .typing{opacity:.6}
ul.check{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
ul.check li::before{content:"✓";color:var(--green);font-weight:700;margin-inline-end:6px}
ul.check.miss li::before{content:"✗";color:var(--red)}
.molbox{display:grid;place-items:center;background:#fff;border-radius:12px}
.molbox svg{width:100%;height:auto;max-width:360px}
.labpair{display:grid;grid-template-columns:1fr;gap:var(--s3)}

.orig{margin:0;background:#fff;border:1px dashed var(--line-strong);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.orig .crop{max-width:100%;max-height:240px;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;min-height:40px;cursor:pointer}
.chip-btn[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-50);color:var(--amber)}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:72px}
.explain p{margin:6px 0}
.step-text{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:48px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line-strong);display:block}
.dots i.on{background:var(--primary)}
.famrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2)}
.scrolltabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.scrolltabs button{flex:none}

// personas do not raise factual accuracy); it comes from the fact bank, the explicit rules below and the checker.

  simplify: 'a lecturer known for making hard pharmacy topics easy',

  reels: 'a pharmacist and science communicator who writes gripping micro-lessons',
  drugs: 'a clinical pharmacologist who is also a gifted storyteller',
  counter: 'a senior community and hospital pharmacist who trains students at the dispensing counter',
  matrix: 'a senior examiner who knows exactly which items students confuse',
  mnemonics: 'a learning scientist and memory coach',
  review: 'a senior examiner who designs one-page revision sheets',
  ladder: 'a senior exam setter trained in item writing',
  spot: 'a senior examiner who plants realistic student mistakes',
  teach: 'a patient Socratic tutor',
  calc: 'a pharmaceutical calculations instructor',
  patient: 'a clinical pharmacist (PharmD) who supervises ward training',
  counsel: 'a community pharmacist and communication-skills trainer',
  lab: 'a professor of pharmaceutical chemistry who teaches structure drawing and structure-activity relationships',
  exam: 'a senior examiner who sets end-of-term exams',
  facts: 'a meticulous academic editor who maps lectures and extracts their facts'

// Explicit writing rules per button: concrete constraints work better than titles.
const RULES = {
  mcq: 'Question rules: exactly one best answer; the stem is a complete question; wrong options are other true statements or terms from this same lecture that do not answer this question; options have similar length and form; no "all of the above" or "none of the above"; no clues in grammar or wording; the answer index points to the correct option.',
  story: 'Story rules: narrative words (scenes, analogies, names of people) are decoration only and never carry a new fact; every factual statement comes from a listed fact.',
  ground: 'Every item lists in "facts" the IDs (like "F12") of the facts it relies on. Use only facts from the FACT BANK; an item that needs a fact not in the bank must be left out.'
};
const AUDIENCE = 'You are writing for a pharmacy student who is preparing for an exam on this lecture.';
function systemFor(mode, lec) {
  const m = lec && lec.map;
  const subject = (m && (m.discipline || m.subject)) || 'pharmacy';
  const title = (lec && (lec.title || (m && m.title))) || 'the uploaded lecture';
  return [
    `Write as ${PEDAGOGY[mode] || PEDAGOGY.simplify}, teaching ${subject}. ${AUDIENCE} The lecture is "${title}".`,
    'Accuracy rules: every fact, number, dose, drug name and claim must come from the student\'s lecture. Explain, connect and build analogies or scenarios, but never add facts and never contradict the lecture. When the lecture is silent, leave it out. Never give individualized dosing advice for a real patient.',
    'Every item carries "page" (the [[PAGE n]] number where its support appears) and "section" (the lecture section it belongs to).',
    'Write clear, exam-ready English. Return ONLY valid JSON in exactly the requested shape, with no markdown.'
  ].join('\n');
}
function lectureText(lec, pages) {
  const texts = lec.text || []; const want = pages && pages.length ? new Set(pages) : null;
  let out = '';
  for (let i = 0; i < texts.length; i++) {
    if (want && !want.has(i + 1)) continue;
    const chunk = `\n[[PAGE ${i + 1}]]\n${texts[i]}`;
    if (out.length + chunk.length > LIMITS.textCap) break;
    out += chunk;
  }
  return out;
}

/* ---------- lecture map and scanned-file transcription ---------- */
function normalizeMap(o, N) {
  const m = {
    title: str(o.title), subject: str(o.subject), discipline: str(o.discipline),
    sections: arr(o.sections).map(s => ({ title: str(s && s.title), pages: [...new Set(arr(s && s.pages).map(p => pageNum(p, N)).filter(Boolean))].sort((a, b) => a - b) })).filter(s => s.title),
    drugs: strs(o.drugs), hasCalculations: o.hasCalculations === true, hasConfusables: o.hasConfusables === true, dispensingRelevant: o.dispensingRelevant === true,
    mentionsStructures: o.mentionsStructures === true, counsellingSubject: o.counsellingSubject === true, treatmentSubject: o.treatmentSubject === true
  };
  if (!m.sections.length) m.sections = [{ title: m.title || 'Lecture', pages: Array.from({ length: N || 0 }, (_, i) => i + 1) }];
  return m;
}
async function aiTranscribe(blob, N, onPages) {
  const b64 = await blobToBase64(blob);
  const prompt = `This is a scanned pharmacy lecture${N ? ' of ' + N + ' pages' : ''}. Transcribe the readable text of every page faithfully, in reading order, page by page; pages are numbered from 1 in file order. Include text inside tables and figures. For a diagram or chemical structure without text, write a one-line description in square brackets. Do not summarize and do not add anything. JSON: {"pages":[{"page":int,"text":string}]}`;
  const o = await AIX.call({ parts: [{ inline_data: { mime_type: 'application/pdf', data: b64 } }, { text: prompt }], system: 'You transcribe lecture files faithfully. Return ONLY valid JSON.', schema: SCHEMAS.transcribe, timeout: 300000, onProgress: (t) => onPages && onPages(countItems(t)) });
  const pages = Array.from({ length: N || 0 }, () => '');
  for (const p of arr(o.pages)) { const n = pageNum(p && p.page); if (!n || n > 400) continue; while (pages.length < n) pages.push(''); pages[n - 1] = (pages[n - 1] ? pages[n - 1] + '\n' : '') + str(p.text); }
  if (!pages.join('').trim()) throw new AppError('لم أستطع قراءة نص هذا الملف. تأكد أن صفحاته واضحة وأعد المحاولة.');
  return pages;
}

/* ---------- fact bank: every testable fact with its page and verbatim quote, checked locally ---------- */
// One request on the lighter model reads the lecture: its map and its fact bank. Every fact keeps only if its
// quote is found word for word in the lecture, so the bank's accuracy is checked here, not trusted.
async function aiRead(lec, bg) {
  const prompt = `Read this pharmacy lecture and return its MAP and its FACT BANK in one JSON object.
MAP fields: "title" (the lecture's own title), "subject" (the course), "discipline" (the precise academic discipline, for example Pharmacology, Pharmaceutics, Industrial Pharmacy, Pharmaceutical Chemistry, Pharmacognosy, Clinical Pharmacy, Pharmaceutical Microbiology, Biochemistry, Pharmaceutical Calculations or Cosmetic Science), "sections" (the lecture's real sections in order, each with the page numbers it covers; 3-15 sections), "drugs" (generic names of every drug the lecture discusses), "hasCalculations" (true if it teaches formulas or numeric problems), "hasConfusables" (true if it contains items students commonly confuse), "dispensingRelevant" (true if it can be tested through realistic dispensing situations in a pharmacy), "mentionsStructures" (true if the lecture shows or discusses chemical structures, structural formulas, functional groups or structure-activity relationships), "counsellingSubject" (true ONLY if the lecture belongs to Community Pharmacy, Pharmacy Practice or Communication Skills), "treatmentSubject" (true if it teaches the drug treatment of diseases or patient cases).
FACT BANK field "facts": the distinct, testable facts it states (definitions, classifications, mechanisms, uses, adverse effects, contraindications, interactions, doses and numbers, process steps, comparisons, formulas). One fact per item, as a short self-contained sentence that keeps the lecture's terms. "quote": the shortest phrase of the lecture that states it, copied word for word (max 20 words). "kind": one of definition, classification, mechanism, use, adverse, contraindication, interaction, dose, number, process, comparison, formula, other. Also "page" and "section". Cover the whole lecture in order, most exam-relevant facts first within each section; at most 120 facts.
JSON: {"title","subject","discipline","sections":[{"title","pages":[int]}],"drugs":[string],"hasCalculations","hasConfusables","dispensingRelevant","mentionsStructures","counsellingSubject","treatmentSubject","facts":[{"text","quote","kind","page","section"}]}\n\nLECTURE:${lectureText(lec)}`;
  const o = await AIX.call({ parts: [{ text: prompt }], system: systemFor('facts', lec), schema: SCHEMAS.read, timeout: 240000, bg, tier: 'lite' });
  const facts = [];
  for (const f of arr(o.facts)) {
    const text = str(f && f.text), quote = str(f && f.quote), page = pageNum(f && f.page, lec.pageCount);
    if (!text || !quoteFound(lec, page, quote)) continue; // a fact the lecture does not contain never enters the bank
    facts.push({ id: 'F' + (facts.length + 1), text, quote, kind: str(f.kind) || 'other', page, section: str(f.section) });
  }
  return { map: normalizeMap(o, lec.pageCount), facts };
}
// Map and fact bank come from the same single request, once per lecture, in the background.
// Buttons never wait for it: until the bank exists they ground on the lecture's own sentences.
function ensureRead(lec, urgent) {
  if (lec.map && lec.facts) return Promise.resolve(lec);
  return laneJob('read:' + lec.id, async (bg) => {
    const r = await aiRead(lec, bg);
    const upd = { factsJson: JSON.stringify(r.facts) };
    if (!lec.map) { upd.mapJson = JSON.stringify(r.map); if (!lec.subject && r.map.subject) upd.subject = r.map.subject; }
    saved(await Store.set('lectures', lec.id, upd, { merge: true })); patchLecture(lec.id, upd);
    return upd;
  }, urgent).then(upd => { const keep = {}; for (const k of Object.keys(upd)) if (!(k === 'mapJson' && lec.map) && !(k === 'factsJson' && lec.facts)) keep[k] = upd[k]; Object.assign(lec, keep); hydrateLecture(lec); return lec; });
}
function ensureFacts(lec, urgent) { return lec.facts ? Promise.resolve(lec.facts) : ensureRead(lec, urgent).then(() => lec.facts); }
const hasBank = (lec) => !!(lec && lec.facts && lec.facts.length >= 5);
function factsBlock(lec, pages, prefix) {
  const want = pages && pages.length ? new Set(pages) : null;
  return (lec.facts || []).filter(f => !want || want.has(f.page)).map(f => `${prefix || ''}${f.id} [p${f.page}] ${f.text}`).join('\n');
}
// Grounding instruction + source block for a prompt: the fact bank when it exists, the page-tagged lecture otherwise.
function grounding(lec, pages, withText) {
  if (hasBank(lec)) return '\n' + RULES.ground + '\n\nFACT BANK:\n' + factsBlock(lec, pages) + (withText ? '\n\nLECTURE' + (pages && pages.length ? ' PART' : '') + ':' + lectureText(lec, pages) : '');
  return '\nEvery fact-bearing item also has "evidence": ONE sentence copied word for word from the lecture that supports it (max 30 words), and "facts": [].\n\nLECTURE' + (pages && pages.length ? ' PART' : '') + ':' + lectureText(lec, pages);
}
// Keep only items that cite real facts of the bank (or, without a bank, whose evidence sentence is found in the lecture).
function keepGrounded(items, lec, required = true) {
  if (!hasBank(lec)) return required ? keepVerified(items, lec) : items;
  const bank = new Map(lec.facts.map(f => [f.id, f]));
  const out = items.map(x => {
    const ids = [...new Set(strs(x.facts).map(id => id.toUpperCase().replace(/^.*-/, '')).filter(id => bank.has(id)))];
    const f0 = ids.length ? bank.get(ids[0]) : null;
    return Object.assign(x, { facts: ids, page: x.page || (f0 ? f0.page : 0), evidence: f0 ? f0.quote : str(x.evidence), evidencePage: f0 ? f0.page : x.page, verified: ids.length > 0 });
  }).filter(x => !required || x.facts.length);
  if (items.length && !out.length) throw new AppError('لم نجد في محاضرتك ما يكفي لبناء نتيجة موثوقة هذه المرة. أعد المحاولة.');
  return out;
}
// Independent reviewer: drops any question whose key is unsupported, that has a second defensible answer, or that adds claims.
async function aiCheck(items, lec, toQ) {
  const bank = new Map(((lec && lec.facts) || []).map(f => [f.id, f]));
  const list = items.map((x, i) => { const q = toQ(x); if (!q || !arr(q.options).length) return null; const sup = arr(q.facts).map(id => bank.get(id)).filter(Boolean).map(f => f.id + ': ' + f.text); return { i, question: q.question, options: q.options, answer: q.answer, support: sup.length ? sup : [str(q.evidence)] }; }).filter(Boolean);
  if (!list.length) return items;
  const prompt = `Review these exam questions before students see them. For each one use ONLY its "support" statements. Decide: "keySupported" (true if the option at index "answer" is correct according to the support), "otherCorrect" (indexes of any OTHER option that is also correct or defensible according to the support; [] if none), "unsupported" (true if the question or its keyed answer claims something the support does not state). Be strict. JSON: {"verdicts":[{"i":int,"keySupported":bool,"otherCorrect":[int],"unsupported":bool,"note":string}]}\n\nQUESTIONS:\n${JSON.stringify(list)}`;
  let o;
  try { o = await AIX.call({ parts: [{ text: prompt }], system: 'You are a strict, independent exam reviewer. Return ONLY valid JSON.', schema: SCHEMAS.check, timeout: 120000, budget: 30000, tier: 'lite' }); }
  catch (e) { return items; } // the generator's own grounding still applies when the reviewer is unreachable
  const byI = new Map(list.map(q => [q.i, q]));
  const bad = new Set(arr(o.verdicts).filter(v => v && byI.has(v.i) && (v.keySupported === false || v.unsupported === true || arr(v.otherCorrect).some(k => Number.isInteger(k) && k !== byI.get(v.i).answer))).map(v => v.i));
  const kept = items.filter((x, i) => !bad.has(i));
  if (!kept.length) throw new AppError('لم تجتز الأسئلة التدقيق هذه المرة. أعد المحاولة.');
  return kept;

const DAY_MS = 864e5;

function buildSchedule(items, examMs, hoursPerDay, nowMs) {
  const start = startOfDay(nowMs), exam = startOfDay(examMs);
  const nDays = Math.round((exam - start) / DAY_MS);
  if (nDays < 1) throw new AppError('اختر موعد امتحان بعد اليوم.');
  const cap = Math.max(30, Math.round(hoursPerDay * 60));
  const days = Array.from({ length: nDays }, (_, i) => ({ date: start + i * DAY_MS, sessions: [], used: 0 }));
  const eve = nDays >= 2 ? nDays - 1 : -1;
  const studyDays = eve >= 0 ? eve : nDays;
  const pick = (it) => ({ lectureId: it.lectureId, lectureTitle: it.lectureTitle, section: it.section });
  if (eve >= 0) {
    const seen = new Set();
    for (const it of items) { if (seen.has(it.lectureId)) continue; seen.add(it.lectureId); days[eve].sessions.push({ type: 'quick', lectureId: it.lectureId, lectureTitle: it.lectureTitle, section: '', minutes: 20 }); days[eve].used += 20; }
  }
  const queue = [...items].sort((a, b) => (Number(b.keep) - Number(a.keep)) || (a.priority - b.priority));
  let pending = [];
  for (let i = 0; i < studyDays; i++) {
    const day = days[i];
    pending.sort((a, b) => a.due - b.due);
    for (const r of pending) { if (r.due <= i && day.used + r.minutes <= cap) { day.sessions.push(Object.assign({ type: 'review', minutes: r.minutes }, pick(r.it))); day.used += r.minutes; r.done = true; } }
    pending = pending.filter(r => !r.done);
    while (queue.length) {
      const it = queue[0]; const m = Math.max(15, Math.min(240, Math.round(it.minutes || 45)));
      if (day.used === 0 || day.used + m <= cap) {
        queue.shift(); day.sessions.push(Object.assign({ type: 'study', minutes: m }, pick(it))); day.used += m;
        for (const gap of [1, 3, 7]) if (i + gap < studyDays) pending.push({ due: i + gap, it, minutes: Math.max(10, Math.round(m * 0.3)) });
      } else break;
    }
  }

}

/* ============================== ASK YOUR TEACHER ==============================
   A floating «اسأل أستاذك» inside every method. Without the student typing it, the question carries what they are
   looking at (the item they last touched, or the one in the middle of the screen), what they last did there, the
   matching lecture pages (±1) and the facts of those pages. Every sentence of the answer must rest on a fact of the
   bank or on words found verbatim in the lecture; the app removes anything else. Runs on the lighter model.
   Free trial: 5 questions a day. Chats stay on this device only; nothing is collected. */

${did ? 'WHAT THE STUDENT DID THERE: ' + did + '\n' : ''}${earlier ? 'EARLIER IN THIS CHAT:\n' + earlier + '\n' : ''}QUESTION: ${q}

JSON: {"answer":[{"text","facts":[],"quote","page"}],"analogy","notInLecture","refusal"}

const S = { user: null, profile: null, aiKey: null, settings: { priceIQD: null }, isAdmin: false, lectures: null, outputs: {}, authReady: false, route: null };

function canUseTrialHere() { const f = LS.get('lecture.trialDevice'); return !f || f === S.user.uid; }
function canUpload() { const s = subState(); return s === 'active' || (s === 'trial' && canUseTrialHere()); }
function isTrialLecture(l) { return !!(l && l.isTrial && S.profile && S.profile.trialLectureId === l.id); }

const Auth = {
  mode: 'local', fb: null, auth: null, cb: null,
  setupLocal() { this.mode = 'local'; },
  setupFirebase(authM, app) { this.mode = 'firebase'; this.fb = authM; this.auth = authM.getAuth(app); },
  start(cb) {
    this.cb = cb;
    if (this.mode === 'firebase') {
      this.fb.onAuthStateChanged(this.auth, u => cb(u ? { uid: u.uid, displayName: u.displayName || '', email: u.email || '' } : null));
      this.fb.getRedirectResult(this.auth).catch(e => toast(authErr(e), true));
    } else cb(LS.get('lecture.localUser'));
  },
  async signIn(name) {
    if (this.mode === 'firebase') {
      needOnline();

      catch (e) {
        const c = (e && e.code) || '';

        if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;

      }

function authErr(e) {
  const c = (e && e.code) || '';
  if (c.includes('network')) return 'تعذّر الاتصال. تحقق من الإنترنت وأعد المحاولة.';
  if (c.includes('unauthorized-domain')) return 'نطاق الموقع غير مضاف في إعدادات الدخول. راجع خطوات النشر.';

    const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js'; s.async = true;

  if (String.fromCharCode(...new Uint8Array(buf.slice(0, 5))) !== '%PDF-') throw new AppError('هذا الملف ليس PDF صالحًا.');

    let prompt = `The student explained the section "${opts.sectionTitle}" in their own words. Compare the explanation with what the lecture says in that section. Judge meaning, not wording or language (the student may write in Arabic). Be strict but kind. Write the feedback in English. JSON: {"score":int 0-10,"correct":[string],"missing":[string],"wrong":[{"said":string,"fix":string,"page":int}],"summary":string,"page":int,"section":string}`;
    prompt += `\n\nLECTURE SECTION:${lectureText(lecture, sec && sec.pages.length ? sec.pages : null)}\n\nSTUDENT EXPLANATION:\n${opts.studentText}`;
    const c = normalizeOutput('teach', await AIX.call({ parts: [{ text: prompt }], system: systemFor('teach', lecture), schema: SCHEMAS.teach, onProgress }), N, lecture);

async function redeemCode(raw) {
  needOnline();
  const code = toWestern(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 10) throw new AppError('الكود من 10 رموز. تأكد منه وأعد المحاولة.');
  const c = await Store.get('codes', code);
  if (!c) throw new AppError('الكود غير صحيح.');
  if (c.redeemedBy) throw new AppError('استُعمل هذا الكود من قبل.');
  const base = Math.max(Date.now(), S.profile.subscriptionUntil || 0);
  const until = base + (Number(c.days) || LIMITS.subDays) * DAY_MS;
  const res = await Store.batch([
    { op: 'set', col: 'codes', id: code, data: { redeemedBy: S.user.uid, redeemedAt: Date.now() }, merge: true },
    { op: 'set', col: 'users', id: S.user.uid, data: { subscriptionUntil: until, lastCode: code }, merge: true }]);
  if (res && res.queued) throw new AppError('لم يكتمل التفعيل بسبب الاتصال. أعد المحاولة وأنت متصل.');
  setProfile({ subscriptionUntil: until, lastCode: code });
  return until;
}

// Functional groups are found by fixed chemistry rules (SMARTS), never guessed by the model.
const FG = [
  ['acid', 'حمض كربوكسيلي', 'carboxylic acid', '[CX3](=O)[OX2H1,OX1-]'],
  ['ester', 'إستر', 'ester', '[#6][CX3](=O)[OX2H0][#6]'],
  ['lactam', 'حلقة بيتا-لاكتام', 'beta-lactam ring', '[#6]1(=O)[#7][#6][#6]1'],
  ['amide', 'أميد', 'amide', '[NX3][CX3](=[OX1])[#6]'],
  ['sulfonamide', 'سلفوناميد', 'sulfonamide', '[SX4](=O)(=O)[NX3]'],
  ['amine1', 'أمين أولي', 'primary amine', '[NX3;H2;!$(NC=[O,S,N]);!$(N-a)][#6]'],
  ['amine2', 'أمين ثانوي', 'secondary amine', '[NX3;H1;!$(NC=[O,S,N]);!$(N-a);!a]([#6])[#6]'],
  ['amine3', 'أمين ثالثي', 'tertiary amine', '[NX3;H0;!$(NC=[O,S,N]);!$(N-a);!a]([#6])([#6])[#6]'],
  ['quat', 'أمونيوم رباعي', 'quaternary ammonium', '[NX4+]'],
  ['phenol', 'فينول', 'phenol', '[OX2H][c]'],
  ['alcohol', 'كحول', 'alcohol', '[OX2H][CX4]'],
  ['ketone', 'كيتون', 'ketone', '[#6][CX3](=O)[#6]'],
  ['aldehyde', 'ألدهيد', 'aldehyde', '[CX3H1](=O)[#6]'],
  ['ether', 'إيثر', 'ether', '[OX2;!$(OC=O);!$(O[H])]([#6])[#6]'],
  ['halogen', 'هالوجين', 'halogen', '[F,Cl,Br,I]'],
  ['nitro', 'مجموعة نيترو', 'nitro group', '[$([NX3](=O)=O),$([NX3+](=O)[O-])]'],
  ['nitrile', 'نيتريل', 'nitrile', '[CX2]#[NX1]'],
  ['thioether', 'ثايوإيثر', 'thioether', '[SX2]([#6])[#6]'],
  ['arom6', 'حلقة عطرية سداسية', 'six-membered aromatic ring', 'a1aaaaa1'],

function groupsOf(R, mol) {
  const out = [];
  for (const [key, ar, en, sm] of FG) {
    const q = R.get_qmol(sm); if (!q) continue;
    let hits = []; try { hits = JSON.parse(mol.get_substruct_matches(q) || '[]'); } catch (e) { hits = []; }
    q.delete();
    if (!Array.isArray(hits) || !hits.length) continue;
    const atoms = [...new Set(hits.flatMap(x => x.atoms || []))];
    if (key === 'amide' && out.some(g => g.key === 'lactam')) { const lac = out.find(g => g.key === 'lactam').atoms; if (atoms.every(a => lac.includes(a))) continue; }
    out.push({ key, ar, en, atoms, hits: hits.map(x => x.atoms || []) });
  }
  return out;
}

async function scanStructures(lec, bg) {
  const blob = await FileVault.get(lec.id);
  if (!blob) throw new AppError('ملف المحاضرة غير موجود على هذا الجهاز.');
  const b64 = await blobToBase64(blob);
  const prompt = `List every chemical structure DRAWN in this lecture (skeletal or structural formulas of molecules; not text formulas, not tables, not reaction arrows alone). For each: "page" (1-based page number in file order), "box" ([ymin, xmin, ymax, xmax] of the drawing on that page, integers 0-1000), "label" (the compound's name exactly as written next to the drawing or in the slide title; "" if none). JSON: {"structures":[{"page":int,"box":[int,int,int,int],"label":string}]}`;
  const o = await AIX.call({ parts: [{ inline_data: { mime_type: 'application/pdf', data: b64 } }, { text: prompt }], system: 'You locate chemical structure drawings in lecture slides precisely. Return ONLY valid JSON.', schema: SCHEMAS.structScan, timeout: 200000, bg });
  const N = lec.pageCount; const list = [];
  for (const s of arr(o.structures)) {
    const page = pageNum(s && s.page, N); const b = arr(s && s.box).map(Number);
    if (!page || b.length !== 4 || b.some(x => !Number.isFinite(x)) || b[2] - b[0] < 30 || b[3] - b[1] < 30) continue;
    list.push({ id: 'S' + (list.length + 1), page, box: b.map(x => Math.max(0, Math.min(1000, Math.round(x)))), label: str(s.label) });

}

  const tabsDef = [['plan', 'الخطة'], ['map', 'خريطة المادة'], ['mixed', 'امتحان مختلط'], ['link', 'أسئلة الربط'], ['last', 'آخر 10 دقائق']];
  let cur = 'plan'; const tabs = h('div', { class: 'tabs scrolltabs', role: 'group', 'aria-label': 'أقسام ليلة الامتحان' }); const body = h('div', { style: 'margin-top:12px' });
  const ctx = { lang: 'en', reveal: false, onResult: (r) => { Store.set('attempts', 'exam_' + ex.id + '_' + Date.now().toString(36), { ownerUid: S.user.uid, lectureId: (ex.lectureIds || [])[0] || '', outputId: ex.id, mode: 'exam', score: r.score, total: r.total, wrongPoints: r.wrongPoints.slice(0, 30), createdAt: Date.now() }).catch(() => null); } };
  const factsChip = (x) => x.lectureTitle ? h('div', { class: 'xs muted', dir: 'auto' }, x.lectureTitle, ' ', pageBadge(x.page)) : null;
  const draw = () => {
    tabs.textContent = ''; tabsDef.forEach(([k, l]) => tabs.append(h('button', { type: 'button', 'aria-pressed': String(cur === k), onclick() { cur = k; draw(); } }, l)));
    body.textContent = '';
    if (cur === 'plan') {
      body.append(h('ol', { class: 'stack planlist' }, c.plan.order.map((o, i) => h('li', { class: 'card stack' }, h('div', { class: 'spread' }, t('b', (i + 1) + '. ' + o.title), h('span', { class: 'chip' }, o.minutes + ' دقيقة')),
        o.focus.length ? h('div', { class: 'small' }, h('b', null, 'أتقن: '), t('span', o.focus.join(' • '))) : null, o.skim.length ? h('div', { class: 'small muted' }, h('b', null, 'اقرأ سريعًا: '), t('span', o.skim.join(' • '))) : null,
        h('a', { class: 'small', href: '#/lecture/' + encodeURIComponent(o.lectureId) }, 'افتح المحاضرة')))), c.plan.advice ? h('div', { class: 'golden', dir: 'auto' }, t('span', c.plan.advice)) : null);
    } else if (cur === 'map') {
      body.append(h('div', { class: 'stack' }, c.map.lectures.map(x => h('div', { class: 'pbox b-blue' }, t('h3', x.title), h('ul', null, x.top.map(p => h('li', { dir: 'auto' }, p.text, ' ', pageBadge(p.page)))))),
        c.map.links.length ? h('div', { class: 'pbox b-plum' }, h('h3', null, 'خيوط الربط بين المحاضرات'), h('ul', null, c.map.links.map(p => h('li', { dir: 'auto' }, p.text)))) : null));
    } else if (cur === 'mixed' || cur === 'link') {
      const qs = c[cur];
      if (!qs.length) body.append(emptyState('search', 'لا أسئلة هنا هذه المرة', 'لم تجتز الأسئلة التدقيق. جهّز ليلة جديدة.'));
      else body.append(quizView(qs, ctx, cur));
    } else {
      body.append(h('ol', { class: 'lastlist' }, c.last.map((p, i) => h('li', null, h('span', { class: 'n' }, String(i + 1)), h('div', { dir: 'auto' }, p.text, factsChip(p))))),
        h('p', { class: 'xs muted' }, 'اقرأها قبل دخول القاعة.'));
    }
  };
  draw();
  return h('div', null, h('div', { class: 'small muted', style: 'margin-bottom:8px' }, t('span', ex.title), ' • ', ex.hours + ' ساعات'), c && c._lite ? liteNote() : null, tabs, body);
}

/* ============================== BOOT ============================== */
async function initFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const [appM, authM, fsM] = await withTimeout(Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]), 20000);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  let db;
  try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
  catch (e) { db = fsM.getFirestore(app); }
  Store = makeFirestoreStore(fsM, db);
  Auth.setupFirebase(authM, app);
}
function startAuth() { S.authReady = true; renderBanners(); Auth.start(handleUser); }
async function boot() {
  renderBanners();
  window.addEventListener('online', renderBanners); window.addEventListener('offline', renderBanners);
  const v = frame({ hideTop: true }); v.append(h('div', { class: 'hero' }, logo(96, 'شعار ليكچر'), h('div', { class: 'wordmark' }, 'ليكچر')), loadingState());
  if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
    try { await initFirebase(); }
    catch (e) {
      v.textContent = '';
      v.append(h('div', { class: 'hero' }, logo(96, 'شعار ليكچر')), errorState(new AppError('تعذّر تحميل التطبيق. تحقق من اتصالك بالإنترنت.'), () => location.reload()),
        h('button', { class: 'btn btn-ghost btn-block', type: 'button', onclick() { Store = LocalStore; Auth.setupLocal(); startAuth(); } }, 'تابع على هذا الجهاز فقط (وضع تجريبي)'));
      return;
    }
  } else { Store = LocalStore; Auth.setupLocal(); }
  startAuth();
  FileVault.purgeAudio();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* app works without offline cache */ });
}
boot();
</script>
